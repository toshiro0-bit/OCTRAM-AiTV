<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Xperia CM AI v3.0</title>

<!-- Google Font for sleek modern typography -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;500;700&family=Noto+Sans+JP:wght@300;500;700&display=swap" rel="stylesheet">

<style>
:root {
    --xperia-aspect: calc(21 / 9);
    --phone-width: min(260px, 55vw);
    --phone-height: calc(var(--phone-width) * 2.15);
}

* {
    box-sizing: border-box;
    user-select: none;
}

body {
    margin: 0;
    padding: 0;
    width: 100vw;
    height: 100vh;
    background: #050508;
    overflow: hidden;
    font-family: 'Outfit', 'Noto Sans JP', -apple-system, sans-serif;
    color: #ffffff;
    display: flex;
    justify-content: center;
    align-items: center;
}

/* 抽象的な背景アセット (動画の代替としてアニメーションキャンバス) */
#bg-container {
    position: fixed;
    inset: 0;
    z-index: 1;
    overflow: hidden;
}

.bg-blob {
    position: absolute;
    border-radius: 50%;
    filter: blur(80px);
    opacity: 0.6;
    animation: floatBlob 12s infinite alternate ease-in-out;
}

.bg-blob-1 {
    width: 60vw;
    height: 60vw;
    background: radial-gradient(circle, #3a1c71, #d76d77);
    top: -10%;
    left: -10%;
}

.bg-blob-2 {
    width: 50vw;
    height: 50vw;
    background: radial-gradient(circle, #112244, #553388);
    bottom: -10%;
    right: -10%;
    animation-delay: -6s;
}

@keyframes floatBlob {
    0% { transform: translate(0, 0) scale(1); }
    100% { transform: translate(8%, 8%) scale(1.15); }
}

/* メインステージ */
.stage {
    position: relative;
    z-index: 2;
    width: 100%;
    height: 100%;
    display: flex;
    flex-direction: column;
    justify-content: space-between;
    align-items: center;
    padding: 6vh 20px;
}

/* キャプション表示エリア（上部） */
#caption-container {
    text-align: center;
    max-width: 90%;
    min-height: 80px;
    display: flex;
    flex-direction: column;
    justify-content: center;
    align-items: center;
    transition: opacity 0.4s ease;
}

#caption {
    font-size: clamp(1.4rem, 4vw, 2.4rem);
    font-weight: 700;
    letter-spacing: 0.05em;
    text-shadow: 0 4px 20px rgba(0, 0, 0, 0.8), 0 0 10px rgba(255, 255, 255, 0.2);
    margin: 0;
    background: linear-gradient(180deg, #ffffff 30%, #cccccc 100%);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
}

/* リアルなスマホCGコンテナ */
.phone-wrapper {
    position: relative;
    perspective: 1000px;
    display: flex;
    justify-content: center;
    align-items: center;
    margin: auto 0;
}

#phone {
    position: relative;
    width: var(--phone-width);
    height: var(--phone-height);
    background: #111216;
    border-radius: 32px;
    padding: 10px;
    /* エッジメタルの光沢と影 */
    box-shadow: 
        0 25px 50px -12px rgba(0, 0, 0, 0.9),
        0 0 30px rgba(136, 51, 170, 0.25),
        inset 0 0 2px 1px rgba(255, 255, 255, 0.2),
        inset 0 0 0 2px #282930;
    animation: phoneFloat 6s ease-in-out infinite alternate;
}

@keyframes phoneFloat {
    0% { transform: translateY(0) rotateX(2deg) rotateY(-3deg); }
    100% { transform: translateY(-12px) rotateX(-2deg) rotateY(3deg); }
}

/* サイドボタン類 */
.phone-power-btn {
    position: absolute;
    right: -4px;
    top: 30%;
    width: 4px;
    height: 36px;
    background: #33343c;
    border-radius: 0 2px 2px 0;
    box-shadow: inset -1px 0 1px rgba(255,255,255,0.2);
}

.phone-volume-btn {
    position: absolute;
    right: -4px;
    top: 18%;
    width: 4px;
    height: 50px;
    background: #33343c;
    border-radius: 0 2px 2px 0;
}

/* ディスプレイ画面 */
#screen {
    position: relative;
    width: 100%;
    height: 100%;
    border-radius: 22px;
    overflow: hidden;
    background: #000;
    box-shadow: inset 0 0 8px rgba(0,0,0,0.8);
    display: flex;
    flex-direction: column;
    justify-content: space-between;
}

/* 画面内の動的アニメーション背景 */
.screen-content {
    position: absolute;
    inset: 0;
    background: linear-gradient(135deg, #090e1a, #2a1147, #521c66);
    background-size: 200% 200%;
    animation: gradientShift 8s ease infinite alternate;
    z-index: 1;
}

@keyframes gradientShift {
    0% { background-position: 0% 50%; }
    100% { background-position: 100% 50%; }
}

/* アニメーション用オーロラライト */
.aurora {
    position: absolute;
    inset: 0;
    background: radial-gradient(circle at 50% 30%, rgba(0, 229, 255, 0.35), transparent 60%),
                radial-gradient(circle at 80% 70%, rgba(186, 85, 211, 0.4), transparent 50%);
    mix-blend-mode: screen;
    z-index: 2;
    animation: pulseAurora 4s ease-in-out infinite alternate;
}

@keyframes pulseAurora {
    0% { opacity: 0.6; transform: scale(0.98); }
    100% { opacity: 1; transform: scale(1.05); }
}

/* フロントカメラ＆スピーカーベゼル */
.top-bezel {
    position: absolute;
    top: 0;
    left: 0;
    right: 0;
    height: 20px;
    z-index: 10;
    display: flex;
    justify-content: center;
    align-items: center;
}

.camera-lens {
    width: 8px;
    height: 8px;
    background: #08080a;
    border-radius: 50%;
    border: 1px solid #1a1a24;
    box-shadow: inset 0 0 2px #00e5ff;
}

.speaker-grille {
    position: absolute;
    top: 4px;
    width: 32px;
    height: 2px;
    background: #252530;
    border-radius: 1px;
}

/* ガラス反射エフェクト */
.glass-glare {
    position: absolute;
    inset: 0;
    background: linear-gradient(
        115deg,
        rgba(255, 255, 255, 0.25) 0%,
        rgba(255, 255, 255, 0.05) 25%,
        transparent 45%,
        transparent 100%
    );
    z-index: 12;
    pointer-events: none;
}

/* スクリーン内のUI要素 */
.screen-ui {
    position: relative;
    z-index: 5;
    height: 100%;
    display: flex;
    flex-direction: column;
    justify-content: space-between;
    padding: 24px 16px 16px 16px;
    box-sizing: border-box;
}

.status-bar {
    display: flex;
    justify-content: space-between;
    font-size: 10px;
    color: rgba(255,255,255,0.8);
    font-weight: 500;
}

.ui-widget {
    margin-top: 20px;
    text-align: center;
}

.ui-clock {
    font-size: 2.2rem;
    font-weight: 300;
    letter-spacing: -1px;
    line-height: 1;
}

.ui-date {
    font-size: 0.7rem;
    opacity: 0.7;
    margin-top: 4px;
    text-transform: uppercase;
    letter-spacing: 1px;
}

.ui-ai-badge {
    align-self: center;
    background: rgba(255, 255, 255, 0.12);
    backdrop-filter: blur(10px);
    border: 1px solid rgba(255, 255, 255, 0.2);
    padding: 6px 14px;
    border-radius: 20px;
    font-size: 0.65rem;
    letter-spacing: 2px;
    text-transform: uppercase;
    box-shadow: 0 4px 15px rgba(0,0,0,0.2);
    display: flex;
    align-items: center;
    gap: 6px;
}

.ai-dot {
    width: 6px;
    height: 6px;
    background: #00e5ff;
    border-radius: 50%;
    box-shadow: 0 0 8px #00e5ff;
    animation: blink 1.5s infinite;
}

@keyframes blink {
    0%, 100% { opacity: 0.3; }
    50% { opacity: 1; }
}

/* 下部サブタイトル・ロゴ */
#sub-container {
    text-align: center;
    margin-top: auto;
}

#sub {
    font-size: 1.2rem;
    font-weight: 700;
    letter-spacing: 0.3em;
    color: #ffffff;
    text-shadow: 0 2px 10px rgba(0,0,0,0.5);
    margin: 0;
}

/* タイムコード */
#tc {
    position: fixed;
    right: 20px;
    bottom: 20px;
    color: rgba(255, 255, 255, 0.4);
    font-family: monospace;
    font-size: 13px;
    letter-spacing: 1px;
    z-index: 10;
    background: rgba(0, 0, 0, 0.4);
    padding: 4px 8px;
    border-radius: 4px;
    backdrop-filter: blur(4px);
}
</style>
</head>

<body>

<!-- アニメーション背景グラデーション -->
<div id="bg-container">
    <div class="bg-blob bg-blob-1"></div>
    <div class="bg-blob bg-blob-2"></div>
</div>

<div class="stage">
    <!-- キャプションテキスト -->
    <div id="caption-container">
        <h1 id="caption">最新スマホ、誕生。</h1>
    </div>

    <!-- スマホCG -->
    <div class="phone-wrapper">
        <div id="phone">
            <!-- ボタンパーツ -->
            <div class="phone-power-btn"></div>
            <div class="phone-volume-btn"></div>

            <!-- スマホ画面 -->
            <div id="screen">
                <!-- 画面背景 & 光源エフェクト -->
                <div class="screen-content"></div>
                <div class="aurora"></div>

                <!-- トップベゼル & カメラ -->
                <div class="top-bezel">
                    <div class="speaker-grille"></div>
                    <div class="camera-lens"></div>
                </div>

                <!-- 画面UI表示 -->
                <div class="screen-ui">
                    <div class="status-bar">
                        <span>5G</span>
                        <span>100%</span>
                    </div>
                    
                    <div class="ui-widget">
                        <div class="ui-clock" id="phone-clock">10:23</div>
                        <div class="ui-date">FRI, OCTOBER 23</div>
                    </div>

                    <div class="ui-ai-badge">
                        <div class="ai-dot"></div>
                        <span>Xperia AI Active</span>
                    </div>
                </div>

                <!-- 前面ガラスの反射効果 -->
                <div class="glass-glare"></div>
            </div>
        </div>
    </div>

    <!-- サブテキスト -->
    <div id="sub-container">
        <div id="sub">XPERIA</div>
    </div>
</div>

<!-- タイムコード -->
<div id="tc">00:00</div>

<script>
const scenes = [
    { t: 0,  main: "最新スマホ、誕生。", sub: "XPERIA" },
    { t: 3,  main: "AIが最適な設定を。", sub: "AI CAMERA" },
    { t: 6,  main: "臨場感あふれる視聴体験。", sub: "OLED DISPLAY" },
    { t: 9,  main: "この一台で、新しい世界を。", sub: "NEW EXPERIENCE" },
    { t: 12, main: "新しい体験を、今すぐ。", sub: "XPERIA" }
];

const cap = document.getElementById("caption");
const sub = document.getElementById("sub");
const tc = document.getElementById("tc");
const phoneClock = document.getElementById("phone-clock");

const start = Date.now();
let currentSceneIndex = -1;

// 画面内時計のリアルタイム更新機能
function updatePhoneClock() {
    const now = new Date();
    const hours = String(now.getHours()).padStart(2, '0');
    const minutes = String(now.getMinutes()).padStart(2, '0');
    if (phoneClock) {
        phoneClock.textContent = `${hours}:${minutes}`;
    }
}
updatePhoneClock();
setInterval(updatePhoneClock, 10000);

// CMシーン切り替えループ
setInterval(() => {
    const elapsed = (Date.now() - start) / 1000;
    const t = elapsed % 15;

    // タイムコード表示更新
    tc.textContent = t.toFixed(1) + "s";

    // 現在のシーン判定
    let activeIndex = 0;
    for (let i = scenes.length - 1; i >= 0; i--) {
        if (t >= scenes[i].t) {
            activeIndex = i;
            break;
        }
    }

    // シーン変更時のみテキスト更新＆フェードアウト・イン演出
    if (activeIndex !== currentSceneIndex) {
        currentSceneIndex = activeIndex;
        
        const capContainer = document.getElementById("caption-container");
        capContainer.style.opacity = "0";
        sub.style.opacity = "0";

        setTimeout(() => {
            cap.textContent = scenes[activeIndex].main;
            sub.textContent = scenes[activeIndex].sub;
            capContainer.style.opacity = "1";
            sub.style.opacity = "1";
        }, 200);
    }
}, 100);
</script>

</body>
</html>
